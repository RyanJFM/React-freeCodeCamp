<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
      body {
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }

      .send-button {
        background-color: rgb(52, 154, 52);
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }

      .chat-input {
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }

      .app-container {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
      }

      .chat-message-robot {
        display: flex;
        justify-content: start;
        align-items: start;
      }

      .chat-message-text {
        background-color: rgb(237, 235, 235);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }

      .chat-message-profile {
        width: 45px;
      }

      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }

      .chat-messages-container-empty {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .loading-icon {
        height: 40px;
        margin: -15px;
      }
    </style>
  </head>

  <body>
    <div class="js-container"></div>

    <!-- import React  -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- chatbot lib  -->
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <!-- get babel to compile JSX -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);

        function handleKeyDown(event) {
          if (event.key === "Enter") {
            sendMessage();
          }
          if (event.key === "Escape") {
            setInputText("");
          }
        }

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        async function sendMessage() {
          if (isLoading || inputText.trim() === "") return;

          setIsLoading(true);

          const userMessage = inputText;

          const newChatMessages = [
            ...chatMessages,
            {
              message: userMessage,
              sender: "user",
              id: crypto.randomUUID(),
            },
            {
              sender: "robot",
              loading: true,
              id: crypto.randomUUID(),
            },
          ];

          setChatMessages(newChatMessages);
          setInputText("");

          const response = await Chatbot.getResponseAsync(userMessage);

          // Replace the last loading message with the real response
          setChatMessages([
            ...newChatMessages.slice(0, -1),
            {
              message: response,
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ]);

          setIsLoading(false);
        }

        return (
          <div className="chat-input-container">
            <input
              placeholder="Send a message to chatbot"
              size="30"
              disabled={isLoading}
              onChange={saveInputText}
              onKeyDown={handleKeyDown}
              value={inputText}
              className="chat-input"
            />
            <button
              disabled={isLoading || inputText.trim() === ""}
              className="send-button"
              onClick={sendMessage}
            >
              Send
            </button>
          </div>
        );
      }

      function ChatMessage({ message, sender, loading }) {
        return (
          <div className={sender === "user" ? "chat-message-user" : "chat-message-robot"}>
            {sender === "robot" && (
              <img src="avatar_default_4.webp" className="chat-message-profile" />
            )}

            <div className="chat-message-text">
              {loading ? (
                <img src="loading-spinner.gif" className="loading-icon" />
              ) : (
                message
              )}
            </div>

            {sender === "user" && (
              <img src="default-pfp-15.webp" className="chat-message-profile" />
            )}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        const chatMessagesRef = React.useRef(null);

        React.useEffect(() => {
          const containerElem = chatMessagesRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [chatMessages]);

        if (chatMessages.length === 0) {
          return (
            <div className="chat-messages-container-empty">
              <p>Welcome to chatbot</p>
            </div>
          );
        }

        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  loading={chatMessage.loading}
                  key={chatMessage.id}
                />
              );
            })}
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([]);

        return (
          <div className="app-container">
            <ChatMessages chatMessages={chatMessages} />
            <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
