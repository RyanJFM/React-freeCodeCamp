<!DOCTYPE html>
<html>
  <head>
    <title>CSS</title>
    <style>
        .email-input {
            margin-bottom: 10px;
            border-radius: 10px;
            padding: 5px 25px;
            border-width: 0.5px;
        }
        .password-input {
            margin-bottom: 10px;
            border-radius: 10px;
            padding: 5px 25px;
            border-width: 0.5px;
        }
        .login-button {
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 30px;
            background-color: rgb(100, 140, 205);
            cursor: pointer;
        }
        .sign-up-button {
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 30px;
            background-color: rgb(100, 140, 205);
            margin-left: 10px;
            cursor: pointer;
        }
        .hide-button {
            color: black;
            border-radius: 5px;
            padding: 2px 5px;
            background-color: azure;
            margin-left: 10px;
            cursor: pointer;
            border-width: 0.5px;
        }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- import React  -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- get babel to compile JSX -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">  
        
        function TextBox() {
            const [passwordCondition, setPasswordCondition] = React.useState('hide');
            
            function showPassword() {
                if (passwordCondition === 'hide') {
                    setPasswordCondition('show');
                } else {
                    setPasswordCondition('hide');
                }
                
            }

            return (
                <>
                    <h2>Hello, Welcome to my website</h2>
                    <div>
                        <input type="text" placeholder="Email" className="email-input"/>
                    </div>
                    <div>
                        <input type={passwordCondition === 'show'? 'text': 'password' } placeholder="Password" className="password-input"/>
                        <button
                            className = "hide-button"
                            onClick={showPassword}
                        >Hide</button>
                    </div>
                </>
            );
        }
        
        function Buttons() {
            return (
                <>
                    <button className="login-button">Login</button>
                    <button className="sign-up-button">Sign up</button>
                </>
            );
        }
        function App() {
            return (
                <div>
                    <TextBox />
                    <Buttons />
                </div>
            );
        }    
        //select continer
        const container = document.querySelector('.js-container');
        //use the container variable inside the specified div
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
