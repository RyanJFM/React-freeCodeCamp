<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <script src="1d.js"></script>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- import React  -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- get babel to compile JSX -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        

        function ProductDetails({message ,price, discountPrice}) {

            if (parseInt(discountPrice) > 0) {
                price = <del>{price}</del>
            }
            return (
            <>
                <div>
                    <p>{message}</p>
                </div>
                <div>
                    <p>Price: ${price}</p>
                </div>
                <div>
                    {discountPrice !== '0' && (<p>Discount price: ${discountPrice}</p>)}
                </div>
                <div>
                    <button>Add to Cart</button>
                </div>
            </> 
          );
        }

        function App() {
          return (
            <>
              <ProductDetails
                message="Cotton socks" 
                price="10.90"
                discountPrice= "5.45"
              />
              <ProductDetails
                message="Tennis balls" 
                price="6.00"
                discountPrice= "0"
              />
              <ProductDetails
                message="Plain T-Shirt" 
                price="7.99"
                discountPrice= "0"
              />
            </>
          );
        }

        const container = document.querySelector('.js-container');
        //use the container variable inside the specified div
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
