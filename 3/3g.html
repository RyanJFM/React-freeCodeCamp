<!DOCTYPE html>
<html>
  <head>
    <title>State Event handlers chatbot project features</title>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- import React  -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- get babel to compile JSX -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">  

        function TextBox() {
            // define dynamic variable
            const [message, newMessage] = React.useState("");

            // update message
            function updateState(event) {
                newMessage(event.target.value)
            }
            // set input box and output in a fragment
            return (
                <>
                    <input 
                        placeholder="Type a name here"
                        onChange={updateState}
                        value={message}
                    />
                    <p>Hello {message}</p>
                </>
            );
        }

        function App() {
            //render text box
            return (
                <TextBox />
            );
        }    
        //select continer
        const container = document.querySelector('.js-container');
        //use the container variable inside the specified div
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
